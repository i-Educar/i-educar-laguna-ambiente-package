# i-Diário em :8443 no mesmo host do i-Educar.
# IMPORTANTE: Host e X-Forwarded-Host DEVEM incluir :8443.
# Sem a porta, o Rails gera Location https://host/usuarios/logar (porta 443)
# e o browser cai no i-Educar → 404.
server {
    listen 8443 ssl http2;
    listen [::]:8443 ssl http2;
    server_name ieducar-laguna.librecode.coop;

    ssl_certificate /etc/letsencrypt/live/ieducar-laguna.librecode.coop/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ieducar-laguna.librecode.coop/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host:8443;
        proxy_set_header X-Forwarded-Host $host:8443;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 8443;
        proxy_set_header X-Forwarded-Ssl on;
        proxy_read_timeout 300;
        proxy_connect_timeout 60;
    }
}
