name: Deploy Laguna

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/laguna/deploys/REGISTRY.jsonl'
  workflow_dispatch:
    inputs:
      run_migrate:
        description: Rodar migrate --force no servidor
        type: boolean
        default: false

concurrency:
  group: deploy-laguna-${{ github.repository }}
  cancel-in-progress: false

jobs:
  deploy:
    uses: ./.github/workflows/reusable-deploy-laguna.yml
    with:
      package_repo: i-educar-laguna-ambiente-package
      server_path: packages/buriti/i-educar-laguna-ambiente-package
      run_migrate: ${{ github.event_name == 'workflow_dispatch' && inputs.run_migrate || false }}
    secrets:
      LAGUNA_SSH_HOST: ${{ secrets.LAGUNA_SSH_HOST }}
      LAGUNA_SSH_USER: ${{ secrets.LAGUNA_SSH_USER }}
      LAGUNA_SSH_KEY: ${{ secrets.LAGUNA_SSH_KEY }}
      LAGUNA_APP_PATH: ${{ secrets.LAGUNA_APP_PATH }}
      IEDUCAR_DEPLOY_TOKEN: ${{ secrets.IEDUCAR_DEPLOY_TOKEN }}
