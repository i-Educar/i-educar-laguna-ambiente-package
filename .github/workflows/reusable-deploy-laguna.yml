# Deploy reutilizável → VPS Laguna (Modelópolis).
# Chamado pelos pacotes da org i-Educar após push em main.
#
# Segurança:
#   - Callers devem piná-lo por SHA completo (nunca @main). Ver docs/laguna/deploys/REUSABLE_PIN.
#   - Actions de terceiros pinadas por SHA.
#   - Environment GitHub com required reviewers (gate humano).
#   - contents: read no job; bump/tag só com LAGUNA_DEPLOY_TOKEN (escopo mínimo).
#   - SSH com known_hosts fixo (sem accept-new / sem ssh-keyscan em runtime).
#
# Secrets (org ou repo + environment):
#   LAGUNA_SSH_HOST, LAGUNA_SSH_USER, LAGUNA_SSH_KEY, LAGUNA_APP_PATH
#   LAGUNA_SSH_KNOWN_HOSTS  — uma ou mais linhas OpenSSH known_hosts (fingerprint esperado)
#   LAGUNA_DEPLOY_TOKEN     — PAT/App com Contents: Read and write só nos repos dos pacotes
name: Reusable · Deploy Laguna

on:
  workflow_call:
    inputs:
      package_repo:
        description: Nome do repositório (ex. i-educar-assinatura-digital-package)
        required: true
        type: string
      server_path:
        description: Caminho relativo no app (obrigatório — não buscar paths.map em main)
        required: true
        type: string
      ref:
        description: SHA/ref a publicar (vazio = commit do caller)
        required: false
        type: string
        default: ''
      run_tests:
        description: Rodar tests/run.php (CI + pós-deploy no servidor)
        required: false
        type: boolean
        default: true
      run_migrate:
        description: Rodar migrate --path do pacote no servidor
        required: false
        type: boolean
        default: true
      environment:
        description: Environment GitHub com proteção (required reviewers)
        required: false
        type: string
        default: laguna-production
    secrets:
      # Preferir secrets no Environment laguna-production (ou org).
      # Callers podem usar `secrets: inherit` ou passar explicitamente.
      LAGUNA_SSH_HOST:
        required: false
      LAGUNA_SSH_USER:
        required: false
      LAGUNA_SSH_KEY:
        required: false
      LAGUNA_APP_PATH:
        required: false
      LAGUNA_SSH_KNOWN_HOSTS:
        required: false
      LAGUNA_DEPLOY_TOKEN:
        required: false

# Mínimo no workflow; write de git só via LAGUNA_DEPLOY_TOKEN.
permissions:
  contents: read

jobs:
  deploy:
    name: Deploy ${{ inputs.package_repo }} → Laguna
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    # Evita loop: bump de versão no próprio workflow committa com [skip ci].
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]') }}
    permissions:
      contents: read
    steps:
      - name: Validar server_path
        run: |
          set -euo pipefail
          REL='${{ inputs.server_path }}'
          if [ -z "$REL" ]; then
            echo "::error::server_path é obrigatório (não resolvemos paths.map em @main)."
            exit 1
          fi
          case "$REL" in
            packages/buriti/*|packages/portabilis/*) ;;
            *)
              echo "::error::server_path inválido: $REL (esperado packages/buriti/... ou packages/portabilis/...)"
              exit 1
              ;;
          esac
          echo "rel=$REL" >> "$GITHUB_OUTPUT"
        id: path

      - name: Exigir secrets de deploy
        run: |
          set -euo pipefail
          missing=0
          for v in LAGUNA_SSH_HOST LAGUNA_SSH_USER LAGUNA_SSH_KEY LAGUNA_APP_PATH LAGUNA_SSH_KNOWN_HOSTS LAGUNA_DEPLOY_TOKEN; do
            # Indireção via env injetado abaixo
            eval "val=\${$v}"
            if [ -z "${val}" ]; then
              echo "::error::Secret $v ausente (grave no Environment laguna-production ou org)."
              missing=1
            fi
          done
          exit "$missing"
        env:
          LAGUNA_SSH_HOST: ${{ secrets.LAGUNA_SSH_HOST }}
          LAGUNA_SSH_USER: ${{ secrets.LAGUNA_SSH_USER }}
          LAGUNA_SSH_KEY: ${{ secrets.LAGUNA_SSH_KEY }}
          LAGUNA_APP_PATH: ${{ secrets.LAGUNA_APP_PATH }}
          LAGUNA_SSH_KNOWN_HOSTS: ${{ secrets.LAGUNA_SSH_KNOWN_HOSTS }}
          LAGUNA_DEPLOY_TOKEN: ${{ secrets.LAGUNA_DEPLOY_TOKEN }}

      - name: Checkout pacote
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          path: package
          # Token de deploy (não GITHUB_TOKEN) — bump/tag com permissions: contents: read.
          token: ${{ secrets.LAGUNA_DEPLOY_TOKEN }}
          ref: ${{ inputs.ref != '' && inputs.ref || github.sha }}

      - name: Bump de versão do módulo (composer.json)
        id: version
        working-directory: package
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json, os, re, pathlib
          p = pathlib.Path("composer.json")
          data = json.loads(p.read_text(encoding="utf-8"))
          raw = str(data.get("version") or "0.0.0").strip()
          parts = re.split(r"[.\-+]", raw)
          nums = []
          for part in parts[:3]:
              m = re.match(r"(\d+)", part or "0")
              nums.append(int(m.group(1)) if m else 0)
          while len(nums) < 3:
              nums.append(0)
          nums[2] += 1
          nova = ".".join(str(n) for n in nums[:3])
          data["version"] = nova
          p.write_text(json.dumps(data, indent=4, ensure_ascii=False) + "\n", encoding="utf-8")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"version={nova}\n")
          print(f"version {raw} → {nova}")
          PY

      - name: Gerar deploy-info.json + commit versão
        id: deployinfo
        working-directory: package
        env:
          VERSION: ${{ steps.version.outputs.version }}
          REPO: ${{ inputs.package_repo }}
        run: |
          set -euo pipefail
          git config user.name "i-Educar Deploy Bot"
          git config user.email "deploy-bot@users.noreply.github.com"
          NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          COMPOSER=$(python3 -c 'import json; print(json.load(open("composer.json")).get("name",""))')
          export NOW COMPOSER
          python3 <<'PY'
          import json, os
          info = {
            "package": os.environ["REPO"],
            "composer": os.environ["COMPOSER"],
            "version": os.environ["VERSION"],
            "sha": "pending",
            "full_sha": "pending",
            "deployed_at": os.environ["NOW"],
            "source": "github-actions",
          }
          open("deploy-info.json", "w", encoding="utf-8").write(json.dumps(info, indent=2) + "\n")
          PY
          git add composer.json deploy-info.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: bump version to ${VERSION} [skip ci]"
            # Checkout por SHA deixa detached HEAD — precisa refspec completo.
            git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
          fi
          SHA=$(git rev-parse --short HEAD)
          FULL=$(git rev-parse HEAD)
          python3 <<PY
          import json
          info = json.load(open("deploy-info.json", encoding="utf-8"))
          info["sha"] = """$SHA"""
          info["full_sha"] = """$FULL"""
          info["tag"] = ""
          open("deploy-info.json", "w", encoding="utf-8").write(json.dumps(info, indent=2) + "\n")
          print(json.dumps(info, indent=2))
          PY
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "full=$FULL" >> "$GITHUB_OUTPUT"
          echo "deployed_at=$NOW" >> "$GITHUB_OUTPUT"
          echo "composer=$COMPOSER" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Setup PHP (testes do módulo)
        if: ${{ inputs.run_tests }}
        uses: shivammathur/setup-php@bf6b4fbd49ca58e4608c9c89fba0b8d90bd2a39f # 2.35.5
        with:
          php-version: '8.3'
          coverage: none
          tools: none

      - name: Testes específicos do módulo (CI)
        if: ${{ inputs.run_tests }}
        id: tests_ci
        working-directory: package
        run: |
          set -euo pipefail
          if [ ! -f tests/run.php ]; then
            echo "::notice::Sem tests/run.php — skip testes CI"
            echo "ran=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::group::php tests/run.php (checkout isolado)"
          set +e
          OUT=$(php tests/run.php 2>&1)
          RC=$?
          set -e
          echo "$OUT"
          echo "::endgroup::"
          echo "ran=true" >> "$GITHUB_OUTPUT"
          if [ "$RC" -ne 0 ] || echo "$OUT" | grep -qE '^[[:space:]]*FAIL'; then
            echo "::warning::Smoke CI isolado falhou (exit ${RC}) — gate definitivo nos testes pós-deploy"
          fi

      - name: Preparar SSH (known_hosts fixo)
        env:
          KNOWN_HOSTS: ${{ secrets.LAGUNA_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.LAGUNA_SSH_KEY }}" > ~/.ssh/id_laguna
          chmod 600 ~/.ssh/id_laguna
          # Sem ssh-keyscan / accept-new: só o fingerprint pré-aprovado no secret.
          if [ -z "${KNOWN_HOSTS//[[:space:]]/}" ]; then
            echo "::error::LAGUNA_SSH_KNOWN_HOSTS vazio — grave o known_hosts esperado no secret/org ou no Environment."
            exit 1
          fi
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          printf '%s\n' \
            'Host laguna' \
            '  HostName ${{ secrets.LAGUNA_SSH_HOST }}' \
            '  User ${{ secrets.LAGUNA_SSH_USER }}' \
            '  IdentityFile ~/.ssh/id_laguna' \
            '  IdentitiesOnly yes' \
            '  StrictHostKeyChecking yes' \
            '  UserKnownHostsFile ~/.ssh/known_hosts' > ~/.ssh/config
          chmod 600 ~/.ssh/config
          ssh -o BatchMode=yes -o ConnectTimeout=15 laguna 'echo ok-ssh' >/dev/null

      - name: Sync rsync → servidor
        id: sync
        run: |
          set -euo pipefail
          APP="${{ secrets.LAGUNA_APP_PATH }}"
          REL="${{ steps.path.outputs.rel }}"
          DEST="${APP}/${REL}"
          SHA=$(git -C package rev-parse --short HEAD)
          FULL=$(git -C package rev-parse HEAD)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "full=$FULL" >> "$GITHUB_OUTPUT"
          echo "dest=$DEST" >> "$GITHUB_OUTPUT"
          ssh laguna "mkdir -p '$DEST'"
          # Path lixo de rsync antigo (www-data) — limpar antes do --delete
          ssh laguna "sudo rm -rf '$DEST/resources/views/home' 2>/dev/null || true"
          rsync -az --delete \
            --no-perms --no-owner --no-group --omit-dir-times \
            --exclude '.git/' \
            --exclude 'vendor/' \
            --exclude 'node_modules/' \
            --exclude '.env' \
            --exclude 'storage/' \
            --exclude 'tmp/' \
            package/ "laguna:${DEST}/" || { rc=$?; [ "$rc" -eq 23 ] || exit "$rc"; }
          echo "Synced $REL @ $SHA → $DEST"

      - name: Pós-deploy (migrate do pacote + testes + artisan)
        id: postdeploy
        run: |
          set -euo pipefail
          APP="${{ secrets.LAGUNA_APP_PATH }}"
          REL="${{ steps.path.outputs.rel }}"
          ssh laguna "bash -s" <<EOF
          set -euo pipefail
          cd '$APP'
          REL='$REL'
          RUN_MIGRATE='${{ inputs.run_migrate }}'
          RUN_TESTS='${{ inputs.run_tests }}'

          php_bin() {
            if id www-data >/dev/null 2>&1; then
              sudo -u www-data php "\$@"
            else
              php "\$@"
            fi
          }

          # Lixo acidental de rsync antigo (path absoluto sob views)
          if [ -d "\${REL}/resources/views/home" ]; then
            echo "::warning::Removendo path acidental \${REL}/resources/views/home"
            sudo rm -rf "\${REL}/resources/views/home" || true
          fi

          # storage do pacote precisa ser gravável pelo PHP (www-data) nos testes pós-deploy
          if [ -d "\${REL}/storage" ]; then
            sudo chown -R www-data:www-data "\${REL}/storage" 2>/dev/null || true
          fi

          php_bin artisan package:discover --ansi || true

          if [ "\$RUN_MIGRATE" = 'true' ]; then
            MIG_PATH="\${REL}/database/migrations"
            if [ -d "\$MIG_PATH" ] && ls "\$MIG_PATH"/*.php >/dev/null 2>&1; then
              echo "::group::migrate --path=\$MIG_PATH"
              php_bin artisan migrate --force --no-interaction --path="\$MIG_PATH"
              echo "::endgroup::"
            else
              echo "::notice::Sem migrations em \$MIG_PATH — skip migrate"
            fi
          else
            echo "::notice::run_migrate=false — skip migrate"
          fi

          if [ "\$RUN_TESTS" = 'true' ]; then
            if [ -f "\${REL}/tests/run.php" ]; then
              echo "::group::tests/run.php (servidor)"
              set +e
              OUT=\$(php_bin "\${REL}/tests/run.php" 2>&1)
              RC=\$?
              set -e
              echo "\$OUT"
              echo "::endgroup::"
              if [ "\$RC" -ne 0 ]; then
                echo "::error::tests/run.php falhou (exit \$RC)"
                exit "\$RC"
              fi
              if echo "\$OUT" | grep -qE '^[[:space:]]*FAIL'; then
                echo "::error::tests/run.php reportou FAIL"
                exit 1
              fi
            else
              echo "::notice::Sem \${REL}/tests/run.php — skip testes no servidor"
            fi

            if [ -d "\${REL}/tests/Feature" ] && [ -x vendor/bin/phpunit ]; then
              echo "::group::phpunit Feature"
              set +e
              vendor/bin/phpunit --colors=always "\${REL}/tests/Feature"
              PRC=\$?
              set -e
              echo "::endgroup::"
              if [ "\$PRC" -ne 0 ]; then
                echo "::error::phpunit Feature falhou (exit \$PRC)"
                exit "\$PRC"
              fi
            fi
          fi
          EOF

      - name: Esvaziar caches Laravel (fim do pipeline)
        if: ${{ always() && steps.sync.outcome == 'success' }}
        run: |
          set -euo pipefail
          APP="${{ secrets.LAGUNA_APP_PATH }}"
          ssh laguna "bash -s" <<EOF
          set -euo pipefail
          cd '$APP'
          php_bin() {
            if id www-data >/dev/null 2>&1; then
              sudo -u www-data php "\$@"
            else
              php "\$@"
            fi
          }
          echo "::group::artisan cache flush"
          php_bin artisan view:clear || true
          php_bin artisan cache:clear || true
          php_bin artisan config:clear || true
          php_bin artisan route:clear || true
          php_bin artisan event:clear || true
          php_bin artisan optimize:clear || true
          # OPcache (FPM/CLI) — sem derrubar o PHP-FPM
          php_bin -r 'if (function_exists("opcache_reset")) { opcache_reset(); echo "opcache_reset ok\\n"; } else { echo "opcache indisponível no CLI\\n"; }' || true
          if command -v redis-cli >/dev/null 2>&1; then
            PREFIX=\$(php_bin -r 'echo config("cache.prefix") ?: (config("database.redis.options.prefix") ?: "");' 2>/dev/null || true)
            echo "cache prefix hint: \${PREFIX:-n/d}"
          fi
          echo "::endgroup::"
          EOF

      - name: Registrar manifesto de deploy no servidor
        env:
          VERSION: ${{ steps.deployinfo.outputs.version }}
          SHA: ${{ steps.deployinfo.outputs.sha }}
          FULL: ${{ steps.deployinfo.outputs.full }}
          DEPLOYED_AT: ${{ steps.deployinfo.outputs.deployed_at }}
          COMPOSER: ${{ steps.deployinfo.outputs.composer }}
          REPO: ${{ inputs.package_repo }}
          REL: ${{ steps.path.outputs.rel }}
        run: |
          set -euo pipefail
          APP="${{ secrets.LAGUNA_APP_PATH }}"
          python3 <<'PY'
          import json, os
          info = {
            "package": os.environ["REPO"],
            "composer": os.environ.get("COMPOSER") or "",
            "version": os.environ.get("VERSION") or "",
            "sha": os.environ.get("SHA") or "",
            "full_sha": os.environ.get("FULL") or "",
            "deployed_at": os.environ.get("DEPLOYED_AT") or "",
            "path": os.environ["REL"],
            "source": "github-actions",
          }
          open("/tmp/module-deploy-info.json", "w", encoding="utf-8").write(json.dumps(info, indent=2) + "\n")
          print(json.dumps(info, indent=2))
          PY
          scp /tmp/module-deploy-info.json laguna:/tmp/module-deploy-info.json
          ssh laguna "bash -s" <<EOF
          set -euo pipefail
          APP='$APP'
          REL='$REL'
          MANIFEST_DIR="\$APP/storage/app/buriti"
          INFO="\$APP/\$REL/deploy-info.json"
          sudo mkdir -p "\$MANIFEST_DIR" "\$(dirname "\$INFO")"
          sudo cp /tmp/module-deploy-info.json "\$INFO"
          # flock evita corrida entre deploys concorrentes no mesmo JSON
          APP="\$APP" REL="\$REL" sudo -E python3 - <<'PY'
          import json, os, pathlib, fcntl
          app = pathlib.Path(os.environ["APP"])
          rel = os.environ["REL"]
          info = json.loads(pathlib.Path("/tmp/module-deploy-info.json").read_text(encoding="utf-8"))
          manifest_path = app / "storage/app/buriti/modules-deploy.json"
          manifest_path.parent.mkdir(parents=True, exist_ok=True)
          with open(manifest_path, "a+", encoding="utf-8") as fh:
              fcntl.flock(fh.fileno(), fcntl.LOCK_EX)
              fh.seek(0)
              raw = fh.read()
              data = {"modules": {}, "updated_at": None}
              if raw.strip():
                  try:
                      data = json.loads(raw)
                  except Exception:
                      pass
              if not isinstance(data.get("modules"), dict):
                  data["modules"] = {}
              for key in filter(None, [info.get("composer"), info.get("package"), info.get("path"), pathlib.Path(rel).name]):
                  data["modules"][str(key)] = info
              data["updated_at"] = info.get("deployed_at")
              fh.seek(0)
              fh.truncate()
              fh.write(json.dumps(data, indent=2) + "\n")
              fh.flush()
              os.fsync(fh.fileno())
          print("ok", manifest_path)
          PY
          if id www-data >/dev/null 2>&1; then
            sudo chown -R www-data:www-data "\$MANIFEST_DIR" 2>/dev/null || true
            sudo chown www-data:www-data "\$INFO" 2>/dev/null || true
          fi
          EOF

      - name: Tag de deploy no pacote
        id: tag
        working-directory: package
        env:
          SHA: ${{ steps.deployinfo.outputs.sha }}
        run: |
          set -euo pipefail
          TAG="deploy/laguna/$(date -u +%Y%m%d-%H%M)-${SHA}"
          git config user.name "i-Educar Deploy Bot"
          git config user.email "deploy-bot@users.noreply.github.com"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "::notice::Tag $TAG já existe — skip"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git tag -a "$TAG" -m "Deploy Laguna ${{ inputs.package_repo }} @ ${SHA}"
          git push origin "$TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
